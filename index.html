<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer & Compressor</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    h2 {
      color: #2563eb;
      margin-bottom: 8px;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .upload-box {
      border: 2px dashed #cbd5e1;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      background: #fcfcfc;
    }
    input[type="file"] {
      width: 100%;
      cursor: pointer;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
      text-align: left;
    }
    .control-group label {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      display: block;
      margin-bottom: 5px;
    }
    .control-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      font-size: 15px;
      transition: 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .download-btn {
      background: #16a34a;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
    }
    .download-btn:hover { background: #15803d; }
    #result-info {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 500;
      color: #16a34a;
      display: none;
    }
    canvas { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>Image Resizer & Compressor</h2>
  <p>Resize and compress JPG/PNG photos instantly for free!</p>
  
  <div class="upload-box">
    <input type="file" id="upload" accept="image/*">
  </div>
  
  <div class="controls">
    <div class="control-group">
      <label>Width (px)</label>
      <input type="number" id="width" placeholder="Auto">
    </div>
    <div class="control-group">
      <label>Height (px)</label>
      <input type="number" id="height" placeholder="Auto">
    </div>
  </div>

  <button class="btn" onclick="resizeImage()">Resize & Compress</button>
  
  <div id="result-info"></div>
  
  <canvas id="canvas"></canvas>
  <a id="downloadLink" style="display:none;" download="compressed-image.jpg">
    <button class="btn download-btn">Download Resized Image</button>
  </a>
</div>

<script>
  let img = new Image();

  document.getElementById('upload').addEventListener('change', function(e) {
    let file = e.target.files[0];
    if(file) {
      let reader = new FileReader();
      reader.onload = function(event) {
        img.src = event.target.result;
        img.onload = function() {
          document.getElementById('width').value = img.width;
          document.getElementById('height').value = img.height;
        }
      }
      reader.readAsDataURL(file);
    }
  });

  function resizeImage() {
    if (!img.src) {
      alert("Please select an image first!");
      return;
    }

    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d');
    
    let w = parseInt(document.getElementById('width').value) || img.width;
    let h = parseInt(document.getElementById('height').value) || img.height;
    
    canvas.width = w;
    canvas.height = h;
    
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    
    let dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    
    let infoDiv = document.getElementById('result-info');
    infoDiv.style.display = 'block';
    infoDiv.innerHTML = "Image successfully compressed & ready!";

    let downloadLink = document.getElementById('downloadLink');
    downloadLink.href = dataUrl;
    downloadLink.style.display = 'block';
  }
</script>

</body>
</html>
