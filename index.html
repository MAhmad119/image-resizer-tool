<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AM Studio - Image Resizer</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 15px; width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #818cf8; margin-bottom: 5px; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; }
    button { background: #6366f1; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #4f46e5; }
    #info { color: #4ade80; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>
<div class="card">
  <h2>AM Studio</h2>
  <p style="font-size:13px; color:#94a3b8;">Pro Image Compressor</p>
  <input type="file" id="upload" accept="image/*">
  <button onclick="compress()">Compress Image</button>
  <div id="info"></div>
  <canvas id="canvas" style="display:none;"></canvas>
  <a id="download" style="display:none;" download="optimized.jpg"><button style="background:#22c55e;">Download</button></a>
</div>
<script>
  let img = new Image(), origSize = 0;
  document.getElementById('upload').addEventListener('change', e => {
    let f = e.target.files[0];
    if(f) { origSize = f.size; let r = new FileReader(); r.onload = ev => img.src = ev.target.result; r.readAsDataURL(f); }
  });
  function compress() {
    if(!img.src) return alert("Select image first!");
    let c = document.getElementById('canvas'), ctx = c.getContext('2d');
    c.width = img.width; c.height = img.height;
    ctx.drawImage(img, 0, 0);
    let url = c.toDataURL('image/jpeg', 0.8);
    let newSize = Math.round((url.length - 23) * 3 / 4);
    document.getElementById('info').innerText = `Done! ${(origSize/1024).toFixed(1)}KB ➔ ${(newSize/1024).toFixed(1)}KB`;
    let d = document.getElementById('download'); d.href = url; d.style.display = 'block';
  }
</script>
</body>
</html>
